services:
  - type: web
    name: decm-nexus-demo
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DB_PATH
        value: /tmp/decm.sqlite
      - key: SEED_DEMO_DATA
        value: true
      - key: VITE_SITE_URL
        value: https://decm-nexus-demo.onrender.com
